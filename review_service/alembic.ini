# Run from review_service/:  alembic upgrade head
# Override the database with:  alembic -x url=sqlite:///path/to.db upgrade head
[alembic]
script_location = observa_review_service/migrations
sqlalchemy.url = sqlite:///./data/review.sqlite3

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
