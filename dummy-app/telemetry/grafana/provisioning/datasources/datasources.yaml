apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
  # Default, so Explore (the operator's Loki link) opens on logs; dashboard panels name their uid.
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      derivedFields:
        - name: trace_id
          matcherRegex: '"trace_id":\s*"([a-f0-9]{32})"'
          datasourceUid: jaeger
          url: '$${__value.raw}'
  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
