name: observa-investigation
services:
  investigate:
    restart: unless-stopped
    init: true
    build:
      context: ..
      dockerfile: correlation_agent/docker/Dockerfile
    env_file: ../investigation/.env
    entrypoint:
      - /bin/sh
      - -ec
      - |
        # F2 accepts LLM_API_KEY. F3 reads its own mounted file when GROQ_API_KEY is unset.
        if [ -n "$${GROQ_API_KEY:-}" ]; then
          export LLM_API_KEY="$$GROQ_API_KEY"
          unset GROQ_API_KEY XAI_API_KEY
        fi
        export LLM_MODEL="$${LLM_MODEL:-openai/gpt-oss-120b}"
        exec python -m correlation_agent.docker.run "$$@"
      - investigate
    volumes:
      - type: bind
        source: ./.env
        target: /app/correlation_agent/.env
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../alert-detection-grouping/reports
        target: /reports
        read_only: true
        bind:
          create_host_path: false
      - ./runs:/runs
